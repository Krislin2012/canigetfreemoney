<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click for Free Money!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }

    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 1px solid #334155;
    }

    h1 {
      color: #4ade80;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .btn {
      position: absolute;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: 600;
      background: #22c55e;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
      transition: left 0.4s ease-out, top 0.4s ease-out;
      user-select: none;
      white-space: nowrap;
    }

    .btn:hover {
      background: #16a34a;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #334155;
      max-width: 320px;
    }

    .modal h2 {
      color: #ef4444;
      margin-bottom: 0.5rem;
    }

    .modal p {
      color: #f8fafc;
      margin-bottom: 1.5rem;
    }

    .close-btn {
      padding: 8px 16px;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Click for Free Money!</h1>
    <p>Claim your $10 from Kris!</p>
  </div>

  <button id="runawayBtn" class="btn">Claim $10</button>

  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <h2>Nice Try! 😂</h2>
      <p>You got absolutely SCAMMED! Kris isn't giving you $10!</p>
      <button id="closeModal" class="close-btn">Close</button>
    </div>
  </div>

  <script>
    const btn = document.getElementById('runawayBtn');
    const modal = document.getElementById('modalOverlay');
    const closeModal = document.getElementById('closeModal');

    function centerButton() {
      const rect = btn.getBoundingClientRect();
      btn.style.left = `${(window.innerWidth - rect.width) / 2}px`;
      btn.style.top = `${(window.innerHeight / 2) + 60}px`;
    }

    centerButton();

    function moveAway(e) {
      const mouseX = e.clientX || (e.touches && e.touches[0].clientX);
      const mouseY = e.clientY || (e.touches && e.touches[0].clientY);
      
      if (!mouseX || !mouseY) return;

      const rect = btn.getBoundingClientRect();
      const btnX = rect.left + rect.width / 2;
      const btnY = rect.top + rect.height / 2;

      const dist = Math.hypot(mouseX - btnX, mouseY - btnY);

      if (dist < 100) {
        const angle = Math.atan2(btnY - mouseY, btnX - mouseX);
        const moveDist = 120;

        let newX = rect.left + Math.cos(angle) * moveDist;
        let newY = rect.top + Math.sin(angle) * moveDist;

        const padding = 20;
        const maxX = window.innerWidth - rect.width - padding;
        const maxY = window.innerHeight - rect.height - padding;

        if (newX < padding || newX > maxX || newY < padding || newY > maxY) {
          newX = Math.random() * (maxX - padding) + padding;
          newY = Math.random() * (maxY - padding) + padding;
        }

        btn.style.left = `${newX}px`;
        btn.style.top = `${newY}px`;
      }
    }

    document.addEventListener('mousemove', moveAway);
    document.addEventListener('touchmove', moveAway);

    btn.addEventListener('click', () => {
      modal.classList.add('active');
    });

    closeModal.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    window.addEventListener('resize', centerButton);
  </script>
</body>
</html>
